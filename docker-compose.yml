version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: devcircle_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - devcircle_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcircle_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/devcircle
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production}
      - JWT_EXPIRE=7d
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - devcircle_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devcircle_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devcircle_net
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  devcircle_net:
    driver: bridge
